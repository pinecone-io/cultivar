name: Publish to PyPI

# Publishes via PyPI Trusted Publishing (OIDC) — no API token stored as a secret.
# Fires on a version tag (v0.1.0, v0.2.0, ...) or a manual dispatch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Safe default; the publish job overrides with its required scopes below.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # required for OIDC token exchange with PyPI
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
